name: API Postman tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postman-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: auth_app_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas del backend
        run: npm test

      - name: Crear tablas de la API
        env:
          MYSQL_PWD: root
        run: mysql --host=127.0.0.1 --port=3306 --user=root < database/auth_app_db.sql

      - name: Iniciar API y ejecutar coleccion Postman
        shell: bash
        run: |
          env \
            PORT=3000 \
            DB_HOST=127.0.0.1 \
            DB_PORT=3306 \
            DB_USER=root \
            DB_PASSWORD=root \
            DB_NAME=auth_app_db \
            npm start > api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health; then
              echo
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat api.log
              exit 1
            fi
            sleep 1
          done

          npx --yes newman@6 run ci/postman/auth-app-api.postman_collection.json \
            --env-var "baseUrl=http://127.0.0.1:3000"
