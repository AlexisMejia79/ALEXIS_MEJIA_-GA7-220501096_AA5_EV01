$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "usuario": "{{testUser}}",
      "contrasena": "ContrasenaIncorrecta123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('La clave incorrecta no permite el acceso', function () {
          pm.response.to.have.status(401);
          pm.expect(pm.response.json().message).to.include('usuario o contrasena incorrectos');
      });
    language: text/javascript
order: 4000
